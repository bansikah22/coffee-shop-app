spring.application.name=coffee-shop-api
server.port=${SERVER_PORT:18080}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
management.endpoints.web.exposure.include=health,info
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.keycloak.enabled=${KEYCLOAK_ENABLED:false}
app.public-url=${PUBLIC_APP_URL:http://localhost:8088}
app.keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/coffee-shop}
app.keycloak.internal-issuer=${KEYCLOAK_INTERNAL_ISSUER:${app.keycloak.issuer}}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:coffee-shop}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
app.payment.enabled=${PAYMENTS_ENABLED:false}
app.payment.base-url=${PAYMENT_BASE_URL:http://localhost:18081}
app.payment.token-uri=${PAYMENT_TOKEN_URI:${app.keycloak.internal-issuer}/protocol/openid-connect/token}
app.payment.client-id=${PAYMENT_CLIENT_ID:payment-service}
app.payment.client-secret=${PAYMENT_CLIENT_SECRET:}
app.order-confirmation.enabled=${ORDER_CONFIRMATION_EMAIL_ENABLED:false}
app.order-confirmation.from=${SMTP_FROM:no-reply@ember-bean.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=30m
