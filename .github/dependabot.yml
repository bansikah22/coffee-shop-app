version: 2
updates:
  - package-ecosystem: maven
    directory: /payment-service
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Douala
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Douala
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Douala
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /payment-service
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Douala
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Douala
    open-pull-requests-limit: 5