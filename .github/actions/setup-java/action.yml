name: Set up project Java
description: Configure the shared Java toolchain and module-specific Maven cache.
inputs:
  pom-file:
    description: Path to the module Maven manifest.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven
        cache-dependency-path: ${{ inputs.pom-file }}