name: Verify

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payments:
    name: Payments and RabbitMQ integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      payments-db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: disposable-ci-payment-password
        ports: ['15433:5432']
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s --health-timeout 3s --health-retries 20
      demo-db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: demo_orders
          POSTGRES_USER: demo_orders
          POSTGRES_PASSWORD: disposable-ci-demo-password
        ports: ['15434:5432']
        options: >-
          --health-cmd "pg_isready -U demo_orders -d demo_orders"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.2-management
        env:
          RABBITMQ_DEFAULT_USER: payment_demo
          RABBITMQ_DEFAULT_PASS: disposable-ci-rabbit-password
        ports: ['15673:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PAYMENT_INFRA_TEST: 'true'
      PAYMENT_IT_DB_PASSWORD: disposable-ci-payment-password
      PAYMENT_IT_DEMO_PASSWORD: disposable-ci-demo-password
      PAYMENT_IT_RABBIT_USER: payment_demo
      PAYMENT_IT_RABBIT_PASSWORD: disposable-ci-rabbit-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: payment-service/pom.xml
      - name: Verify payments with real databases and broker
        run: mvn --batch-mode --no-transfer-progress -f payment-service/pom.xml verify

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile and build
        run: npm run build

  backend:
    name: Backend compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile, test, and package
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
