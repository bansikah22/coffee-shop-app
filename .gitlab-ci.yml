workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - package
  - containerize
  - sync

variables:
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ''
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: '$CI_REGISTRY_IMAGE/backend'
  FRONTEND_IMAGE: '$CI_REGISTRY_IMAGE/frontend'

default:
  interruptible: true

github:sync:
  stage: sync
  image: alpine:3.22
  needs: []
  resource_group: github-sync
  variables:
    GIT_DEPTH: '0'
    GIT_TERMINAL_PROMPT: '0'
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - |
      if [ -z "${GITHUB_SYNC_TOKEN:-}" ]; then
        echo 'Configure GITHUB_SYNC_TOKEN as a masked, protected GitLab CI/CD variable.' >&2
        exit 1
      fi
      git -c credential.helper= \
        -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GITHUB_SYNC_TOKEN"; fi; }; f' \
        push https://github.com/bansikah22/coffee-shop-app.git \
        "$CI_COMMIT_SHA:refs/heads/$CI_DEFAULT_BRANCH"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true

frontend:verify:
  stage: verify
  image: node:26-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

backend:test:
  stage: verify
  image: maven:3.9.12-eclipse-temurin-25
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - .m2/repository/
  script:
    - cd backend
    - mvn --batch-mode --no-transfer-progress test
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

backend:package:
  stage: package
  image: maven:3.9.12-eclipse-temurin-25
  needs:
    - backend:test
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - .m2/repository/
  script:
    - cd backend
    - mvn --batch-mode --no-transfer-progress package -DskipTests
  artifacts:
    expire_in: 1 week
    paths:
      - backend/target/coffee-shop-api-*.jar
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

.container-build:
  stage: containerize
  image: docker:29.7.0-cli
  services:
    - name: docker:29.7.0-dind
      alias: docker
  before_script:
    - docker info

backend:container:verify:
  extends: .container-build
  needs:
    - job: backend:package
      artifacts: true
  script:
    - docker build --tag "$BACKEND_IMAGE:$CI_COMMIT_SHA" backend
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - .gitlab-ci.yml

backend:container:publish:
  extends: .container-build
  needs:
    - job: backend:package
      artifacts: true
  script:
    - docker build --tag "$BACKEND_IMAGE:$CI_COMMIT_SHA" backend
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - .gitlab-ci.yml

frontend:container:verify:
  extends: .container-build
  script:
    - docker build --tag "$FRONTEND_IMAGE:$CI_COMMIT_SHA" frontend
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml

frontend:container:publish:
  extends: .container-build
  script:
    - docker build --tag "$FRONTEND_IMAGE:$CI_COMMIT_SHA" frontend
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml