services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffee_shop}
      POSTGRES_USER: ${POSTGRES_USER:-coffee_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffee_shop_local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 18080
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-coffee_shop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-coffee_shop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-coffee_shop_local}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8088}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8088}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/coffee-shop}
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_ISSUER:-http://keycloak:8080/realms/coffee-shop}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-coffee-shop}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL:-http://payments:18081}
      PAYMENT_TOKEN_URI: ${PAYMENT_TOKEN_URI:-http://keycloak:8080/realms/coffee-shop/protocol/openid-connect/token}
      PAYMENT_CLIENT_ID: ${PAYMENT_CLIENT_ID:-payment-service}
      PAYMENT_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-payment_demo}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      ORDER_CONFIRMATION_EMAIL_ENABLED: ${ORDER_CONFIRMATION_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@ember-bean.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-18080}:18080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"

  keycloak-database:
    image: postgres:18-alpine
    profiles: [sso]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: [sso]
    ports:
      - "127.0.0.1:8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [sso]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-database
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    depends_on:
      keycloak-database:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./.local/keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro

  payments-db:
    image: postgres:18-alpine
    profiles: [payments, payments-infra]
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-}
    ports:
      - '127.0.0.1:15433:5432'
    volumes:
      - payments-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 3s
      timeout: 3s
      retries: 30

  demo-db:
    image: postgres:18-alpine
    profiles: [payments, payments-infra]
    environment:
      POSTGRES_DB: demo_orders
      POSTGRES_USER: demo_orders
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-}
    ports:
      - '127.0.0.1:15434:5432'
    volumes:
      - demo-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo_orders -d demo_orders']
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2-management
    profiles: [payments, payments-infra]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-payment_demo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    ports:
      - '127.0.0.1:15673:5672'
      - '127.0.0.1:15674:15672'
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  payments:
    profiles: [payments]
    build:
      context: ./payment-service
    environment:
      APP_ROLE: payments
      DATABASE_URL: jdbc:postgresql://payments-db:5432/payments
      DATABASE_USER: payments
      DATABASE_PASSWORD: ${PAYMENT_DB_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-payment_demo}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      PAYMENT_JWT_SECRET: ${PAYMENT_JWT_SECRET:-}
      PAYMENT_ISSUER_URI: ${PAYMENT_ISSUER_URI:-}
      PAYMENT_JWK_SET_URI: ${PAYMENT_JWK_SET_URI:-}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-http://localhost:8088/orders?payment=return}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-http://localhost:8088/orders?payment=cancel}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_PUBLIC_URL: ${PAYMENT_PUBLIC_URL:-http://localhost:18081}
    ports:
      - '127.0.0.1:18081:18081'
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  demo-consumer:
    profiles: [payments]
    build:
      context: ./payment-service
    environment:
      APP_ROLE: consumer
      DATABASE_URL: jdbc:postgresql://demo-db:5432/demo_orders
      DATABASE_USER: demo_orders
      DATABASE_PASSWORD: ${DEMO_DB_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-payment_demo}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      PAYMENT_JWT_SECRET: ${PAYMENT_JWT_SECRET:-}
    ports:
      - '127.0.0.1:18082:18081'
    depends_on:
      demo-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  keycloak-postgres-data:
  payments-data:
  demo-data:
  rabbit-data: